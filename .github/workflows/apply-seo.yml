# Bakes page titles/descriptions from the admin (Pages screen) into the HTML files.
# Runs when triggered (Actions tab → Run workflow, or the API) and every 30 minutes.
name: Apply page titles & descriptions

on:
  workflow_dispatch:
  repository_dispatch:
    types: [seo-updated]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency: apply-seo

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tools/apply-seo.js
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update page titles and descriptions from the admin"
            git push
          fi
