# Automatic nightly backup: every shop in shops.json is backed up (the same file as Admin → Backup → Download backup)
# into the private R2 bucket pullwise-backups (tools/backup-shops.mjs). Daily files are kept 35 days, the 1st of each
# month 400 days. Each backup shows in that shop's Backup → Backup Log. A failed shop fails the run, so GitHub emails.
#
# Run by hand: Actions → Automatic backup → Run workflow (optionally one shop).
# Needs SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN (with R2 edit) and CLOUDFLARE_ACCOUNT_ID (already used by Deploy).
name: Automatic backup

on:
  schedule:
    - cron: '15 8 * * *' # 4:15 a.m. Eastern (3:15 in winter), before the 6:30 imports
  workflow_dispatch:
    inputs:
      shop:
        description: Shop id from shops.json (blank = every shop)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2
      - name: Back up
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHOP: ${{ inputs.shop }}
        run: |
          set -euo pipefail
          if [ -n "$SHOP" ]; then node tools/backup-shops.mjs --shop "$SHOP"; else node tools/backup-shops.mjs; fi
