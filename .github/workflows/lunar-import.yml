# Automatic Lunar import: every morning, Lunar's FOC sheets for the next 8 Mondays and release sheets for this week
# and the next 4 Wednesdays are imported into the master catalog (tools/lunar-auto-import.mjs), with the same rules as
# Admin → Import. Shops copy the titles in on their hourly catalog-sync. Each run shows in the catalog's
# Import → Recent Runs as "Automatic Lunar import".
#
# Run by hand: Actions → Automatic Lunar import → Run workflow (tick "dry run" to only count, or "fill covers" to only
# give every Lunar title with no cover the picture on Lunar's site now, whatever its dates).
# Needs SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (already used by Deploy).
# After each run, what it left out of the catalog is emailed to the LEFT_OUT_EMAIL repository variable (default
# don@getpullwise.com; several addresses separated by commas), sent from the catalog's server as reports@pullwise.shop
# (its report-email function, with the catalog's RESEND_API_KEY function secret).
name: Automatic Lunar import

on:
  schedule:
    - cron: '15 11 * * *' # 7:15 a.m. Eastern (6:15 in winter), after the PRH import
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only count, change nothing)
        required: false
        type: boolean
        default: false
      fill_covers:
        description: Only fill in missing covers from Lunar's site (any date), no import
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lunar-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Supabase client, spreadsheet reader and image resizer
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz jszip@3.10.1 sharp@0.34.3
      - name: Import
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The left-out email after each run, sent from the catalog's server (tools/catalog-job.mjs emailLeftOut).
          LEFT_OUT_EMAIL: ${{ vars.LEFT_OUT_EMAIL || 'don@getpullwise.com' }}
          DRY_RUN: ${{ inputs.dry_run }}
          FILL_COVERS: ${{ inputs.fill_covers }}
        run: |
          set -euo pipefail
          if [ "$FILL_COVERS" = "true" ]; then node tools/lunar-auto-import.mjs --fill-covers
          elif [ "$DRY_RUN" = "true" ]; then node tools/lunar-auto-import.mjs --dry-run
          else node tools/lunar-auto-import.mjs; fi
