# Automatic PRH import: every morning, the comics and graphic novels Penguin Random House has going on sale in the
# next 13 weeks are imported into the master catalog from PRH's API (tools/prh-auto-import.mjs), with the same rules
# as Admin → Import. Shops copy them in on their hourly catalog-sync. Each run shows in the catalog's
# Import → Recent Runs as "Automatic PRH import".
#
# Run by hand: Actions → Automatic PRH import → Run workflow (tick "dry run" to only count, or "refresh covers" to
# only swap PRH's "Cover Coming Soon" pictures for the real covers on every title, whatever its on-sale date).
# Needs the PRH_API_KEY repository secret, plus SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (already used by Deploy and Move images to R2).
# After each run, what it left out of the catalog is emailed to the LEFT_OUT_EMAIL repository variable (default
# don@getpullwise.com; several addresses separated by commas), sent from the catalog's server as reports@pullwise.shop
# (its report-email function, with the catalog's RESEND_API_KEY function secret).
name: Automatic PRH import

on:
  schedule:
    - cron: '30 10 * * *' # 6:30 a.m. Eastern (5:30 in winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only count, change nothing)
        required: false
        type: boolean
        default: false
      refresh_covers:
        description: Only refresh "Cover Coming Soon" covers (any on-sale date), no import
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prh-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2
      - name: Import
        env:
          PRH_API_KEY: ${{ secrets.PRH_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The left-out email after each run, sent from the catalog's server (tools/catalog-job.mjs emailLeftOut).
          LEFT_OUT_EMAIL: ${{ vars.LEFT_OUT_EMAIL || 'don@getpullwise.com' }}
          DRY_RUN: ${{ inputs.dry_run }}
          REFRESH_COVERS: ${{ inputs.refresh_covers }}
        run: |
          set -euo pipefail
          if [ "$REFRESH_COVERS" = "true" ]; then node tools/prh-auto-import.mjs --refresh-covers
          elif [ "$DRY_RUN" = "true" ]; then node tools/prh-auto-import.mjs --dry-run
          else node tools/prh-auto-import.mjs; fi
