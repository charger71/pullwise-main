# Daily status report: one email with the health of every shop in shops.json (tools/shop-status.mjs): scheduled
# jobs, the catalog sync and any catalog titles a shop is missing, the nightly backup, emails sent and failed, and on
# the master catalog the daily PRH and Lunar imports. Sent after the backup and the morning imports have run.
#
# Run by hand: Actions → Daily status report → Run workflow (tick "dry run" to only print the report in the run).
# Needs SUPABASE_ACCESS_TOKEN (already used by Deploy), and to send: the RESEND_API_KEY and RESEND_FROM repository
# secrets, and the STATUS_EMAIL repository variable (default don@getpullwise.com; several addresses separated by commas).
name: Daily status report

on:
  schedule:
    - cron: '41 11 * * *' # 6:41 a.m. Eastern (7:41 in summer): after the 4:15 backup and the 6:30 imports
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (print the report in the run, send no email)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: status-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Supabase client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2
      - name: Report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          STATUS_EMAIL: ${{ vars.STATUS_EMAIL || 'don@getpullwise.com' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then node tools/shop-status.mjs --dry-run; else node tools/shop-status.mjs; fi
