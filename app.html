<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Pull List</title>
  <meta name="robots" content="noindex">
  <!-- The shop's installable pull list app. The Worker serves it at /app with the shop's manifest, colors and icons
       (worker/shop-page.js appManifest, headTags); app.<shop domain> forwards here. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="css/site.css" as="style">
  <link rel="modulepreload" href="js/pages/app.js">
  <link rel="modulepreload" href="js/pages/account.js">
  <link rel="modulepreload" href="js/site.js">
  <link rel="modulepreload" href="js/theme-vars.js">
  <link rel="modulepreload" href="js/data.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/errors.js">
  <link rel="modulepreload" href="js/cache.js">
  <link rel="modulepreload" href="js/social-icons.js">
  <link rel="modulepreload" href="js/content.js">
  <link rel="modulepreload" href="js/customer.js">
  <link rel="modulepreload" href="js/labels.js">
  <link rel="modulepreload" href="js/dates.js">
  <link rel="modulepreload" href="js/vendor/supabase.mjs">
  <link rel="modulepreload" href="js/reservation-list.js">
  <link rel="modulepreload" href="js/discount.js">
  <link rel="modulepreload" href="js/components.js">
  <link rel="modulepreload" href="js/app-device.js">
  <link rel="modulepreload" href="js/app-theme.js">
  <link rel="preload" href="fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <!-- The Light or Dark appearance picked on this phone (js/app-theme.js keeps it), before the first paint. -->
  <script>try{var t=JSON.parse(localStorage.getItem('pc-app-theme')||'{}'),k=t.pick==='device'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t.pick,c=t.css&&t.css[k];if(c){var s=document.createElement('style');s.id='app-theme';s.textContent=c;document.head.appendChild(s)}}catch(e){}</script>
  <script>try{var p=JSON.parse(localStorage.getItem('pc-preload')||'{}');[p.logo].forEach(function(u){if(u&&/^https:/.test(u)){var l=document.createElement('link');l.rel='preload';l.as='image';l.href=u;document.head.appendChild(l)}})}catch(e){}</script>
  <script type="module" src="js/pages/app.js"></script>
</head>
<body data-page="app">
  <!-- Loading screen: the shop's logo and name on its page color until the first view is drawn (js/pages/app.js).
       The Worker fills them in (worker/shop-page.js appSplash); with no script at all it still fades by itself. -->
  <div class="app-splash" data-splash aria-hidden="true">
    <img class="app-splash__logo" data-splash-logo alt="" hidden>
    <p class="app-splash__name" data-splash-name></p>
  </div>
  <header id="site-header"></header>
  <div class="app-note container" data-offline hidden></div>
  <div class="app-note container" data-update hidden></div>
  <div class="app-install container" data-install hidden></div>
  <div class="app-pull" data-pull aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg></div>
  <p class="visually-hidden" role="status" aria-live="polite" data-app-status></p>

  <main id="main" class="app-main">
    <div class="container">
      <h1 class="visually-hidden">My Pull List</h1>
      <!-- Search: the header's search button opens it over whichever tab is showing (js/pages/app.js setupSearch). -->
      <section class="app-search" id="app-search" aria-label="Search" data-search hidden>
        <form role="search" data-search-form>
          <label class="visually-hidden" for="app-q">Search the shop’s titles</label>
          <input id="app-q" name="q" type="search" placeholder="Search titles, series or creators" autocomplete="off" enterkeyhint="search" maxlength="100">
        </form>
        <div data-follow-results></div>
        <div data-search-results hidden></div>
      </section>
      <div id="account"><p class="empty loading">Loading…</p></div>
      <section class="app-view" data-view="hot" aria-labelledby="hot-h" hidden>
        <h2 id="hot-h" class="app-view__title" tabindex="-1">What’s Hot</h2>
        <div data-hot></div>
      </section>
      <section class="app-view" data-view="shop" aria-labelledby="shop-h" hidden>
        <h2 id="shop-h" class="app-view__title" tabindex="-1">The Shop</h2>
        <div data-shop><p class="empty loading">Loading…</p></div>
      </section>
      <!-- Under the Account view, signed in or not (js/app-theme.js setupAppearance). -->
      <section class="app-view app-look" data-view="me" aria-labelledby="look-h" hidden>
        <h2 id="look-h" class="app-view__title">Appearance</h2>
        <div class="panel" data-look></div>
      </section>
    </div>
  </main>

  <nav class="tab-bar" aria-label="App">
    <ul>
      <li><a href="#list" data-tab="list">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>My List</span><span class="tab-bar__count" data-tab-count="list" hidden></span>
      </a></li>
      <li><a href="#hot" data-tab="hot">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3c.6 3.2 5.5 5.6 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.3 1.1-4 2.4-5.2.1 1.7.9 2.9 2.2 3.4-.4-3 .1-5.9.9-8.7z"/></svg>
        <span>Hot</span>
      </a></li>
      <li><a href="#shop" data-tab="shop">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10v10h16V10"/><path d="M3 10l2-6h14l2 6z"/><path d="M10 20v-5h4v5"/></svg>
        <span>Shop</span>
      </a></li>
      <li><a href="#me" data-tab="me">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
        <span>Account</span>
      </a></li>
    </ul>
  </nav>
</body>
</html>
