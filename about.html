<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-seo data-default="About">About</title>
  <meta name="description" content="Our story and the people behind the counter.">
  <meta property="og:title" content="About">
  <link rel="preload" href="css/site.css" as="style">
  <link rel="modulepreload" href="js/pages/static.js">
  <link rel="modulepreload" href="js/site.js">
  <link rel="modulepreload" href="js/data.js">
  <link rel="preload" href="fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <script>try{var p=JSON.parse(localStorage.getItem('pc-preload')||'{}'),h=/^\/(index\.html)?$/.test(location.pathname);[p.logo,h&&p.hero].forEach(function(u){if(u&&/^https:/.test(u)){var l=document.createElement('link');l.rel='preload';l.as='image';l.href=u;document.head.appendChild(l)}})}catch(e){}</script>
  <script type="module" src="js/pages/static.js"></script>
</head>
<body data-page="about">
  <header id="site-header"></header>

  <main id="main">
    <section class="section">
      <div class="container prose">
        <h1>About <span data-setting="shop_name"></span></h1>
        <div class="lede" data-content="about:lede"></div>
        <div class="page-body" data-content="about:body"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
