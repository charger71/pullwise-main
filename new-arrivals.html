<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-seo data-default="New Arrivals">New Arrivals</title>
  <meta name="description" content="Comics, trades, omnibuses, records, toys and Funko Pops in stock now.">
  <meta property="og:title" content="New Arrivals">
  <link rel="preload" href="css/site.css" as="style">
  <link rel="modulepreload" href="js/pages/arrivals.js">
  <link rel="modulepreload" href="js/site.js">
  <link rel="modulepreload" href="js/data.js">
  <link rel="preload" href="fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <script>try{var p=JSON.parse(localStorage.getItem('pc-preload')||'{}'),h=/^\/(index\.html)?$/.test(location.pathname);[p.logo,h&&p.hero].forEach(function(u){if(u&&/^https:/.test(u)){var l=document.createElement('link');l.rel='preload';l.as='image';l.href=u;document.head.appendChild(l)}})}catch(e){}</script>
  <script type="module" src="js/pages/arrivals.js"></script>
</head>
<body data-page="arrivals">
  <header id="site-header"></header>

  <main id="main">
    <section class="section">
      <div class="container">
        <h1>New Arrivals</h1>
        <div class="lede" data-content="new-arrivals:lede"></div>
        <div class="page-body" data-content="new-arrivals:body"></div>

        <form id="filters" class="filters" role="search" aria-label="Filter new arrivals"></form>
        <section id="series" hidden>
          <h2>Series</h2>
          <div id="series-list" class="grid"></div>
        </section>
        <p id="results-count" class="results-count" role="status"></p>
        <div id="results" class="grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
